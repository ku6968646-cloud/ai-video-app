name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          
      # မူရင်းဖိုင်များကို ယာယီသိမ်းဆည်းခြင်း
      - run: mv pubspec.yaml pubspec.yaml.bak
      - run: mv lib/main.dart lib/main.dart.bak
      
      # Flutter Project ကို ဖန်တီးခြင်း (android folder ရလာမည်)
      - run: flutter create --project-name ai_video_app .
      
      # မူရင်းဖိုင်များကို ပြန်လည်ထည့်သွင်းခြင်း
      - run: mv pubspec.yaml.bak pubspec.yaml
      - run: mv lib/main.dart.bak lib/main.dart
      
      # 🌟 build.gradle ကို ပြင်ဆင်ခြင်း (Version များ သတ်မှတ်ခြင်း)
      - name: Patch build.gradle
        run: |
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle
          sed -i 's/ndkVersion flutter.ndkVersion/ndkVersion "25.1.8937393"/g' android/app/build.gradle
      
      # Android Manifest ကို ပြင်ဆင်ခြင်း
      - name: Patch AndroidManifest.xml
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:requestLegacyExternalStorage="true"/g' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/>' android/app/src/main/AndroidManifest.xml
      
      - run: flutter pub get
      - run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
